name = "thumbatic"
compatibility_date = "2024-09-23"
main = "./src/worker/index.ts"

# Durable Objects
[[durable_objects.bindings]]
name = "THUMBNAIL_DO"
class_name = "ThumbnailDO"

# Uploaded images. Keys are the SHA-256 of the bytes, so an object can never be stale
# and name, width, and height ride along as R2 custom metadata. The demo environment
# deliberately has no binding here, which is what keeps it browser only.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "thumbatic-storage"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ThumbnailDO"]

# Serve static assets from the Vite build output directory
[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
run_worker_first = true

# Custom domain configuration for thumbatic.com
# NOTE: Ensure thumbatic.com is added to your Cloudflare account
# and DNS records are configured before deploying.
[[routes]]
pattern = "thumbatic.com"
custom_domain = true

[[routes]]
pattern = "www.thumbatic.com"
custom_domain = true

# Public demo at demo.thumbatic.com.
#
# It runs the local storage build, so thumbnails stay in the visitor's own browser.
# There is deliberately no durable_objects binding here, so the demo has no server side
# store and nobody can write to one. The worker answers 404 for /api when the binding is
# missing. Wrangler warns that durable_objects is not inherited by this environment.
# That warning is expected.
#
# Set no GATE_SECRET here either. The gate is off when the secret is missing, which is
# what keeps the demo open to everyone.
[env.demo]
name = "thumbatic-demo"

[[env.demo.routes]]
pattern = "demo.thumbatic.com"
custom_domain = true

[env.demo.assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
run_worker_first = true
